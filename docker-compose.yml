name: de-realtime-order-pipeline

networks:
  pipeline-net:
    driver: bridge

volumes:
  rabbitmq-data:
  mongo-data:
  prometheus-data:
  grafana-data:

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?isi RABBITMQ_USER di .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?isi RABBITMQ_PASSWORD di .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro,z
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-custom.conf:ro,z
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - pipeline-net

  mongodb:
    image: mongo:7.0
    hostname: mongodb
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        echo "$$MONGO_REPLICA_KEY" > /data/configdb/keyfile
        chmod 400 /data/configdb/keyfile
        chown mongodb:mongodb /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?isi MONGO_USER di .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?isi MONGO_PASSWORD di .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:?isi MONGO_DB di .env}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?isi MONGO_REPLICA_KEY di .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongodb:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test:
        - CMD-SHELL
        - |
          mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }" | grep -q 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - pipeline-net

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro,z
      - prometheus-data:/prometheus
    networks:
      - pipeline-net

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?isi GRAFANA_ADMIN_USER di .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?isi GRAFANA_ADMIN_PASSWORD di .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    depends_on:
      - prometheus
    networks:
      - pipeline-net

  consumer:
    build: ./consumer
    image: de-pipeline-consumer:local
    restart: unless-stopped
    working_dir: /app
    command: ["python", "/app/landing_consumer.py"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:?isi RABBITMQ_USER di .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?isi RABBITMQ_PASSWORD di .env}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-orders.events.queue}
      LANDING_DIR: /landing
      BATCH_SIZE: ${BATCH_SIZE:-500}
      BATCH_FLUSH_SECONDS: ${BATCH_FLUSH_SECONDS:-5}
      CONSUMER_METRICS_PORT: "8000"
    ports:
      - "127.0.0.1:${CONSUMER_METRICS_PORT:-8000}:8000"
    volumes:
      - ./consumer:/app:ro,z
      - ./data/landing:/landing:z
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pipeline-net

  spark:
    build: ./spark
    image: de-pipeline-spark:local
    restart: unless-stopped
    user: "0:0"
    working_dir: /app
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "/app/streaming_job.py"]
    environment:
      LANDING_DIR: /landing
      CHECKPOINT_DIR: /checkpoints
      TRIGGER_INTERVAL_SECONDS: ${TRIGGER_INTERVAL_SECONDS:-10}
      WINDOW_DURATION: ${WINDOW_DURATION:-1 minute}
      WATERMARK_DELAY: ${WATERMARK_DELAY:-30 minutes}
      FAULT_CRASH_AFTER_COMMIT: ${FAULT_CRASH_AFTER_COMMIT:-0}
      MAX_FILES_PER_TRIGGER: ${MAX_FILES_PER_TRIGGER:-60}
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_USER: ${MONGO_USER:?isi MONGO_USER di .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?isi MONGO_PASSWORD di .env}
      MONGO_DB: ${MONGO_DB:?isi MONGO_DB di .env}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_PREFIX: ${S3_PREFIX:-lake}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - ./spark:/app:ro,z
      - ./data/landing:/landing:z
      - ./data/checkpoints:/checkpoints:z
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - pipeline-net

  compact:
    image: de-pipeline-spark:local
    profiles: ["batch"]
    user: "0:0"
    working_dir: /app
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "/app/compact_job.py"]
    environment:
      CHECKPOINT_DIR: /checkpoints
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_PREFIX: ${S3_PREFIX:-lake}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./spark:/app:ro,z
      - ./data/checkpoints:/checkpoints:z
    networks:
      - pipeline-net
