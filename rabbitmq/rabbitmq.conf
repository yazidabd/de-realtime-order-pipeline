# Load exchange, queue, dan binding dari file definitions saat boot
load_definitions = /etc/rabbitmq/definitions.json

# Batas resource supaya aman di laptop
vm_memory_high_watermark.relative = 0.5
disk_free_limit.absolute = 1GB

# Log ke console supaya terbaca lewat docker compose logs
log.console = true
log.console.level = info

# Port endpoint metrics untuk Prometheus
prometheus.tcp.port = 15692
